<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

    <!-- ✅ SEO Basic -->
    <title>Learn Coding, AI & Web Development | CodeSpace AI</title>
    <meta name="description" content="CodeSpace AI: Best tutorials and resources for learning coding, artificial intelligence, and web development. Boost your tech skills with hands-on projects and guides." />
    <meta name="keywords" content="coding, AI, web development, programming, JavaScript, React, Node.js, tech tutorials, code projects, CodeSpace" />
    <meta name="author" content="CodeSpace AI" />

    <!-- ✅ Open Graph / Social Media -->
    <meta property="og:title" content="Learn Coding, AI & Web Development | CodeSpace AI" />
    <meta property="og:description" content="Discover free coding, AI, and web development tutorials with CodeSpace AI. Step into tech with easy guides and project-based learning." />
    <meta property="og:url" content="https://codespaceai.onrender.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://codespaceai.onrender.com/logo.png" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Learn Coding, AI & Web Development | CodeSpace AI" />
    <meta name="twitter:description" content="Level up your coding and AI skills with CodeSpace AI tutorials, projects & guides for beginners and pros." />
    <meta name="twitter:image" content="https://codespaceai.onrender.com/logo.png" />

    <!-- ✅ Favicon / Logo -->
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- ✅ Fonts (Preload) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap">
    
    <!-- ✅ Sitemap & Robots -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://codespaceai.onrender.com/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- ✅ Structured Data JSON-LD Logo & Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CodeSpace AI",
      "url": "https://codespaceai.onrender.com/",
      "logo": "https://codespaceai.onrender.com/logo.png",
      "sameAs": [
        "https://www.linkedin.com/in/himanshu-kashyap-81b92b361"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CodeSpace AI",
      "url": "https://codespaceai.onrender.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://codespaceai.onrender.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <main>
      <h1>CodeSpace AI – Learn Coding, AI & Web Development</h1>
      <div id="root"></div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
